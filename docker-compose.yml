name: crmoney

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crmoney}
      POSTGRES_USER: ${POSTGRES_USER:-crmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crmoney_dev}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 5s, retries: 5}
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crmoney}:${POSTGRES_PASSWORD:-crmoney_dev}@db:5432/${POSTGRES_DB:-crmoney}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-15}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CRMoney}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8082}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8082}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes: [uploads:/app/uploads]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-15}
    depends_on: [backend]
    ports: ["8082:80"]
volumes: {postgres_data: {}, redis_data: {}, uploads: {}}
